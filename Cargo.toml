[package]
name = "career"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
migration = { version = "0.1.0", path = "migration" }
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace]
members = [".", "migration"]

[dev-dependencies]
http-body-util = "0.1.5"
sea-orm = { version = "2.0.4", features = ["mock"] }
tower = { version = "0.5.3", features = ["util"] }
